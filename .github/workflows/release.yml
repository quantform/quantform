name: release

on:
  push:
    branches:
      - main

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v1
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Install dependencies
        run: pnpm install
        
      - name: Build core package
        run: pnpm run build
        working-directory: ./packages/core
      - name: Build sqlite package
        run: pnpm run build
        working-directory: ./packages/sqlite
      - name: Build create package
        run: pnpm run build
        working-directory: ./packages/create

      - name: Test core package
        run: pnpm run test
        working-directory: ./packages/core
      - name: Test sqlite package
        run: pnpm run test
        working-directory: ./packages/sqlite
    

  publish-to-npm:
    needs: ['test-gate']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v1
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.3.1
        
      - run: npx --yes json -I -f package.json -e "this.version='0.7.${{ github.run_number }}'"
      - run: npx --yes json -I -f package.json -e "this.version='0.7.${{ github.run_number }}'"
        working-directory: ./packages/core
      - run: npx --yes json -I -f package.json -e "this.version='0.7.${{ github.run_number }}'"
        working-directory: ./packages/sqlite
      - run: npx --yes json -I -f package.json -e "this.version='0.7.${{ github.run_number }}'"
        working-directory: ./packages/create

      - name: Set npm token
        run: pnpm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build core package
        run: pnpm run build
        working-directory: ./packages/core
      - name: Build sqlite package
        run: pnpm run build
        working-directory: ./packages/sqlite
      - name: Build create package
        run: pnpm run build
        working-directory: ./packages/create

      - name: Publish package
        run: pnpm publish --no-git-checks
        working-directory: ./packages/core
      - name: Publish sqlite package
        run: pnpm publish --no-git-checks
        working-directory: ./packages/sqlite
      - name: Publish create package
        run: pnpm publish --no-git-checks
        working-directory: ./packages/create


